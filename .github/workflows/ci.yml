name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    env:
      # Placeholder values: the build only validates that the app compiles,
      # no real Supabase traffic happens at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # 说明：这里刻意不跑 tests/。该目录下的 e2e 与 browser 套件直连生产
      # Supabase 项目，会真实修改会员余额并给真实顾客发通知；要进 CI 必须先
      # 建 staging 项目并把 URL/口令从夹具改为环境变量。
