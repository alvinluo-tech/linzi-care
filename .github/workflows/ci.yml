name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    env:
      # Placeholder values: the build only validates that the app compiles,
      # no real Supabase traffic happens at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # 必须排在 Build 之后：LayoutProps / PageProps 这类 Next 16 生成类型来自
      # .next/types/**（tsconfig include），而 next-env.d.ts 本身被 gitignore，
      # 干净检出时它们还不存在，先跑 tsc 只会报 Cannot find name 'LayoutProps'。
      - name: Typecheck
        run: npx tsc --noEmit

      # 时区与格式化是纯函数，不碰网络与数据库，可以在 CI 里安全地跑。
      # 这是目前唯一进入 CI 的业务级断言 —— 它防的是"时刻整体偏移"这类
      # 静默错误（页面不报错，但每个时间都差几个小时）。
      - name: Timezone & formatting invariants
        run: |
          npx tsx scripts/verify-format-tz.mts
          TZ=America/New_York npx tsx scripts/verify-format-tz-fallback.mts

      # 说明：这里刻意不跑 tests/ 下的 e2e 与 browser 套件。
      # 它们会真实修改会员余额、给真实顾客发通知，只有在指向**独立的**
      # Supabase 分支库时才适合进 CI。落地步骤见 docs/TESTING.md。
      #
      # 相关的安全改造（已完成）：这两个套件原先硬编码了 service_role 密钥
      # 与账号口令，现已全部改为读环境变量；缺少变量时明确报错退出，
      # 而不是静默用错凭据打生产库。
