name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    env:
      # Placeholder values: the build only validates that the app compiles,
      # no real Supabase traffic happens at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          set +e
          npx eslint . --format unix 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          echo "eslint exit: $status"
          echo "### Lint output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -c 6000 lint-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $status

      - name: Build
        run: npm run build
